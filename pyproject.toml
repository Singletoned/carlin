[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carlin"
version = "0.1.0"
description = "A Python implementation of PugJS template engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lark>=1.1.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
carlin = "carlin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["carlin*"]
